# 复制为 settings.toml，改下面的数字。没写的行用程序里的默认值。改完要重新启动。
# 终端每问独立，不压缩，所以后两项只影响网页和评测。

# 主 Agent 一轮问题的步数上限。默认 128。
# max_steps = 128

# 一个子任务的步数上限。默认 40。
# subtask_steps = 40

# 从这么多 token 起，外置更早的工具结果。默认 40000。
# compact_light = 40000

# 从这么多 token 起，最近一批工具结果也外置。默认 100000，不能小于 compact_light。
# compact_heavy = 100000
